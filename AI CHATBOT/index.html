<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiVote Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 class="chatbot-heading">DigiVote Chatbot</h2>
        </div>
        
        <div id="categories" class="category-list"></div>
        <div id="questions" class="question-list" style="display: none;"></div>
        <div id="answer" class="answer-box" style="display: none;"></div>
        
        <button id="backToCategories" class="nav-button" style="display: none;">🔙 Back to Categories</button>
        <button id="backToQuestions" class="nav-button" style="display: none;">🔙 Back to Questions</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
