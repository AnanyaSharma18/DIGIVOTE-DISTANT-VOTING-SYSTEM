<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Candidates</title>
    <link rel="stylesheet" href="candidate.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-logo">
            <img src="logo.png" alt="Logo" />
          
        <h1>Distant Voting System</h1>
    </div>
    
    <ul class="navbar-menu">
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li>
            <a href="service.html">Services</a>
            <ul class="dropdown-menu">
                <li><a href="#design">Design</a></li>
                <li><a href="#development">Development</a></li>
                <li><a href="#marketing">Marketing</a></li>
            </ul>
        </li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>
    </div>
    </div>
    
      <header class="header">
        <h1>Manage Candidate</h1>
        <p>Managing all the participating Candidates.</p>
      </header> 


    <!-- Main Content -->
    <div class="container">
        <section class="section">
            <h2>Manage Candidates</h2>
            <div class="candidate-actions">
                <button id="add-candidate-btn">Add Candidate</button>
            </div>

            <table class="candidate-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Party</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="candidate-list">
                    <!-- Candidates will be displayed here -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Election Management System. All Rights Reserved.</p>
    </footer>

    <!-- Modal for Adding Candidate -->
    <div id="add-candidate-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h3>Add New Candidate</h3>
            <form id="candidate-form">
                <label for="name">Name:</label>
                <input type="text" id="name" required><br><br>
                <label for="party">Party:</label>
                <input type="text" id="party" required><br><br>
                <button type="submit">Add Candidate</button>
            </form>
        </div>
    </div>

    <script src="candidate.js"></script>
</body>
</html>
